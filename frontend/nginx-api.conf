# Gestartet aus dem Projektordner:
#   nginx -p "<projektordner>/" -e .run/nginx-error.log -c frontend/nginx.conf
# Alle relativen Pfade beziehen sich auf den Projektordner (Präfix).

pid .run/nginx.pid;
error_log .run/nginx-error.log;
worker_processes 1;

events {
  worker_connections 512;
}

http {
  default_type application/octet-stream;
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
    font/woff2 woff2;
  }

  charset utf-8;
  charset_types text/css application/javascript application/json;
  server_tokens off;
  sendfile on;

  access_log .run/nginx-access.log;
  client_body_temp_path .run/nginx-tmp/client_body;
  proxy_temp_path .run/nginx-tmp/proxy;
  fastcgi_temp_path .run/nginx-tmp/fastcgi;
  uwsgi_temp_path .run/nginx-tmp/uwsgi;
  scgi_temp_path .run/nginx-tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json;

  server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root frontend/dist;
    index index.html;

    location = / {
      add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    location = /results.json {
      add_header Cache-Control "no-store" always;
    }

    location = /config.json {
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Ohne charset off hängt nginx "; charset=utf-8" an JSON-Antworten des Backends.
      charset off;
      add_header Cache-Control "no-store" always;
    }
  }
}
